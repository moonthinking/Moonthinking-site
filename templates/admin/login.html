<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Panel Moonthinking</title>
<link rel="icon" href="{{ url_for('static', filename='img/moon_icon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>Panel Moonthinking</h1>
    {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="f">
        <label>Contraseña</label>
        <input type="password" name="password" autofocus required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Entrar</button>
    </form>
  </div>
</div>
</body>
</html>
